</style></head><body><header><a class="brand" href="./"><span class="brandicon">✳</span>함께하는 시간.</a><span class="headerlabel">RESERVATION ↗</span></header><main><section class="intro"><h1>예약</h1><p>날짜와 시간을 선택해 주세요.</p></section><div id="connection" class="banner" role="status"></div><section class="booking"><div class="stephead"><div><span class="stepnum">01</span><h2>날짜 선택</h2></div><span>2026년</span></div><div class="dates" id="dates"></div><div class="divider"></div><div class="stephead"><div><span class="stepnum">02</span><h2>시간 선택</h2></div><span>30분 단위</span></div><div class="selecteddate" id="selecteddate"></div><div id="times" class="times"></div><p class="helper">예약된 시간을 누르면 수정·취소할 수 있어요.</p><div class="bookingbottom"><span></span><button type="button" id="refresh">새로고침 ↻</button></div></section></main><dialog id="notice" class="modal"><h2>예약 안내</h2><p id="message"></p><button class="primary" id="noticeClose">확인</button></dialog><dialog id="booking" class="modal"><button class="close" id="close" aria-label="닫기">✕</button><span class="eyebrow">YOUR RESERVATION</span><h2>예약 신청</h2><div class="summary" id="summary"></div><form id="form"><label for="name">신청자 이름 *</label><input id="name" required maxlength="30" autocomplete="name" placeholder="이름을 입력해 주세요"><label for="password" style="margin-top:16px">수정용 비밀번호 *</label><input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="8자 이상 입력해 주세요"><label for="passwordConfirm" style="margin-top:16px">비밀번호 확인 *</label><input id="passwordConfirm" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="다시 입력해 주세요"><p>이름은 공개됩니다. 비밀번호는 수정·취소에 사용해요.</p><p class="error" id="error" role="alert"></p><button class="primary" id="submit">이 시간으로 신청하기 →</button></form></dialog><dialog id="manage" class="modal"><button class="close" id="manageClose" aria-label="닫기">✕</button><span class="eyebrow">MANAGE RESERVATION</span><h2>내 예약 수정·취소</h2><p id="manageOriginal"></p><form id="manageForm"><label for="editName">신청자 이름 *</label><input id="editName" required maxlength="30"><label for="editSlot" style="margin-top:16px">변경할 날짜와 시간 *</label><select id="editSlot" style="width:100%;padding:13px;border:1px solid #dce3d3;border-radius:8px;background:white"></select><label for="editPassword" style="margin-top:16px">예약할 때 정한 비밀번호 *</label><input id="editPassword" type="password" required maxlength="72" autocomplete="current-password" placeholder="수정용 비밀번호"><p class="error" id="manageError" role="alert"></p><button class="primary" id="saveEdit">변경 내용 저장</button><button type="button" id="cancelBooking" style="width:100%;padding:12px;margin-top:10px;background:transparent;border:1px solid #dbc8bf;border-radius:8px;color:#a35e42">예약 취소하기</button><p>취소하면 해당 시간은 다시 예약할 수 있습니다.</p></form></dialog><dialog id="cancelConfirm" class="modal"><h2>예약을 취소할까요?</h2><p id="cancelSummary"></p><p>취소한 예약은 복구할 수 없으며, 다른 사람이 신청할 수 있어요.</p><button class="primary" id="confirmCancel">네, 예약을 취소할게요</button><button class="primary" style="background:#909a87;margin-top:10px" id="keepBooking">예약 유지하기</button></dialog><script>
// 아래 두 값을 본인의 Supabase 프로젝트 값으로 바꿔 주세요.
// 브라우저용 Publishable key만 사용하세요. secret/service_role 키 사용 금지.
const SUPABASE_URL = "https://ylmxjiegltqcatzytbmw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uRPmxQpPcFj3L7nExFlxaQ_d5MZWzmW";
const dates=[{id:'2026-10-31',label:'10월 31일',day:'토요일',color:'pink'},{id:'2026-11-06',label:'11월 6일',day:'금요일',color:'purple'},{id:'2026-11-07',label:'11월 7일',day:'토요일',color:'blue'},{id:'2026-11-14',label:'11월 14일',day:'토요일',color:'yellow'}];
const times=['13:00 – 13:30','13:30 – 14:00','14:00 – 14:30','14:30 – 15:00','15:00 – 15:30','15:30 – 16:00','16:00 – 16:30','16:30 – 17:00'];
const timesFor=d=>d.day==='토요일'?times:times.slice(0,6);
const initial={'2026-10-31_0':'이수진','2026-10-31_2':'엄민선, 방민순','2026-10-31_3':'김경란','2026-10-31_4':'김애련','2026-11-06_1':'윤성환','2026-11-06_2':'박한나','2026-11-06_3':'박예은'};
const fullMessage='시간대의 예약이 찼습니다. 다른 시간을 골라주세요';
let editing=null;
let selected=0, chosen=null, occupied={...initial},ready=false,busy=false;
const $=id=>document.getElementById(id);
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function notify(message){$('message').textContent=message;$('notice').showModal()}
function render(){ $('dates').replaceChildren();dates.forEach((d,i)=>{const b=el('button','date '+d.color+(selected===i?' active':''));b.type='button';b.setAttribute('aria-pressed',String(selected===i));b.append(el('span','dateweekday',d.day),el('strong','',d.label),el('span','available',i===2?'별도 일정':(timesFor(d).length-Object.keys(occupied).filter(k=>k.startsWith(d.id)).length)+'개 시간 가능'));b.onclick=()=>{selected=i;render()};$('dates').append(b)});$('selecteddate').textContent=dates[selected].label+' '+dates[selected].day+' · 오후';$('times').replaceChildren();if(selected===2){const b=el('div','special','이성아 · 자원봉사자 일정');b.style.gridColumn='1 / -1';$('times').append(b);return}timesFor(dates[selected]).forEach((t,i)=>{const key=dates[selected].id+'_'+i;const name=occupied[key];const b=el('button','time'+(name?' full':''));b.type='button';b.append(el('span','',t),el('small','',name?'예약 마감':'예약 가능'));if(name)b.append(el('span','booker','예약자: '+name));b.onclick=()=>{if(name){openManage(key,name);return}if(!ready){notify('예약 데이터베이스 연결이 필요합니다. 안내 파일에 따라 연결 후 다시 시도해 주세요.');return}chosen={key,date:selected,time:i};$('summary').textContent=dates[selected].label+' '+dates[selected].day+' / '+t;$('name').value='';$('password').value='';$('passwordConfirm').value='';$('error').textContent='';$('booking').showModal();$('name').focus()};$('times').append(b)})}
async function api(path,options={}){const response=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await response.json()}catch{data=null}return {response,data}}
async function refresh(){if(!configured){ready=false;$('connection').hidden=false;$('connection').textContent='미연결 상태 · 기존 예약 현황만 표시하고 있어요. 실제 신청은 Supabase 연결 후 가능합니다.';render();return}try{const {response,data}=await api('booking_reservations?select=slot,name',{cache:'no-store'});if(!response.ok||!Array.isArray(data))throw Error();occupied={};data.forEach(r=>occupied[r.slot]=r.name);ready=true;$('connection').textContent='';$('connection').hidden=true;render()}catch{ready=false;$('connection').hidden=false;$('connection').textContent='예약 현황을 불러오지 못했어요. 연결 설정을 확인하고 새로고침해 주세요.'}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy||!chosen||!ready)return;const name=$('name').value.trim();if(!name){$('error').textContent='이름을 입력해 주세요.';return}busy=true;$('submit').disabled=true;$('error').textContent='';const target={...chosen};if($('password').value!==$('passwordConfirm').value){$('error').textContent='비밀번호 확인이 일치하지 않습니다.';busy=false;$('submit').disabled=false;return}try{const {response,data}=await api('rpc/create_booking',{method:'POST',body:JSON.stringify({p_slot:target.key,p_name:name,p_password:$('password').value})});if(data?.error){$('error').textContent=data.error;return}if(response.status===409&&data?.code==='23505'){ $('booking').close();await refresh();notify(fullMessage);return}if(!response.ok||!data?.ok)throw Error();$('password').value='';$('passwordConfirm').value='';$('booking').close();await refresh();notify(name+'님, 예약이 완료됐어요. '+dates[target.date].label+' '+times[target.time]);}catch{$('error').textContent='예약 처리 결과를 확인하지 못했어요. 새로고침으로 현황을 확인한 후 다시 시도해 주세요.'}finally{busy=false;$('submit').disabled=false}};
function openManage(key,name){
 if(!ready){notify(fullMessage+'\n예약자: '+name+'\n수정·취소는 데이터베이스 연결 후 가능합니다.');return}
 editing=key;const [d,t]=key.split('_');$('manageOriginal').textContent='기존 예약: '+dates.find(x=>x.id===d).label+' '+times[Number(t)];$('editName').value=name;$('editPassword').value='';$('manageError').textContent='';$('editSlot').replaceChildren();
 dates.filter(d=>d.id!=='2026-11-07').forEach(d=>timesFor(d).forEach((time,i)=>{const k=d.id+'_'+i;if(!occupied[k]||k===key){const o=el('option','',d.label+' '+time+(k===key?' (현재 예약)':''));o.value=k;$('editSlot').append(o)}}));$('editSlot').value=key;$('manage').showModal();
}
async function manageBooking(cancel){if(busy||!editing||!ready)return;const name=$('editName').value.trim(),password=$('editPassword').value;if(!password){$('manageError').textContent='예약할 때 정한 비밀번호를 입력해 주세요.';return}if(!cancel&&!name){$('manageError').textContent='이름을 입력해 주세요.';return}busy=true;$('saveEdit').disabled=true;$('cancelBooking').disabled=true;$('confirmCancel').disabled=true;$('manageError').textContent='';try{const {response,data}=await api('rpc/edit_booking',{method:'POST',body:JSON.stringify({p_slot:editing,p_password:password,p_new_slot:$('editSlot').value,p_name:name,p_cancel:cancel})});if(!response.ok)throw Error();if(data?.error){$('manageError').textContent=data.error;return}if(!data?.ok)throw Error();$('editPassword').value='';$('manage').close();await refresh();notify(cancel?'예약이 취소되었습니다.':'예약이 수정되었습니다.');editing=null;}catch{$('manageError').textContent='처리 결과를 확인하지 못했어요. 새로고침으로 현황을 확인해 주세요. SQL 추가 설정도 확인해 주세요.'}finally{busy=false;$('saveEdit').disabled=false;$('cancelBooking').disabled=false;$('confirmCancel').disabled=false}}
$('manageForm').onsubmit=e=>{e.preventDefault();manageBooking(false)};
$('manageClose').onclick=()=>{if(!busy){$('editPassword').value='';$('manage').close()}};
$('manage').addEventListener('cancel',e=>{if(busy)e.preventDefault();else $('editPassword').value=''});
